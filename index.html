<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>حُرّاس الخلية · Cell Guardians</title>
    <meta name="description" content="مغامرة علمية ثلاثية الأبعاد باللغة العربية. العب مع أصدقائك أونلاين واكتشفوا الخلية النباتية والميتوكوندريا والنظام البيئي." />
    <meta name="theme-color" content="#04161a" />
    <meta property="og:title" content="حُرّاس الخلية · Cell Guardians" />
    <meta property="og:description" content="مغامرة علمية ثلاثية الأبعاد · العب مع أصدقائك أونلاين" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2306232a' stroke='%233ff0e0' stroke-width='4'/%3E%3Ccircle cx='26' cy='28' r='10' fill='%23b07bff'/%3E%3Cellipse cx='42' cy='40' rx='8' ry='4' fill='%235dff7a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script src="vendor/peerjs.min.js"></script>
  </head>
  <body>
    <div id="stage"></div>

    <!-- Title / lobby -->
    <section id="title" class="screen">
      <div class="title-card">
        <div class="kicker">CELL GUARDIANS</div>
        <h1>حُرّاس الخلية</h1>
        <p class="tag">مغامرة علمية ثلاثية الأبعاد · العب وحدك أو مع أصدقائك أونلاين</p>

        <label class="field">
          <span>اسم المستكشف</span>
          <input id="nameIn" maxlength="16" autocomplete="off" spellcheck="false" />
        </label>
        <div class="field">
          <span>لون البدلة</span>
          <div class="swatches" id="swatches"></div>
        </div>

        <div id="joinBox" class="join-box" hidden>
          <div>تمت دعوتك إلى الغرفة <b id="joinCodeLbl" dir="ltr"></b></div>
          <button id="joinInvited" class="btn primary">🤝 انضمّ الآن</button>
        </div>

        <button id="createBtn" class="btn primary">🚀 ابدأ مغامرة جديدة</button>
        <div class="or"><span>أو انضم إلى أصدقائك بالرمز</span></div>
        <div class="row">
          <input id="codeIn" dir="ltr" maxlength="6" placeholder="ABCD" autocomplete="off" spellcheck="false" />
          <button id="joinBtn" class="btn">انضمام</button>
        </div>
        <div id="status" class="status" role="status"></div>
        <div class="foot">
          <span><kbd>W A S D</kbd> حركة</span>
          <span><kbd>Space</kbd> قفز</span>
          <span><kbd>Shift</kbd> ركض</span>
          <span><kbd>E</kbd> تفاعل</span>
          <span><kbd>Enter</kbd> دردشة</span>
        </div>
      </div>
    </section>

    <!-- In-game HUD -->
    <section id="hud" hidden>
      <div id="topbar">
        <div id="worldName" class="world-name"></div>
        <div class="stats">
          <span id="score" title="نقاط الفريق">⭐ 0</span>
          <span id="clueCount" title="الدلائل">🔬 0/0</span>
          <span id="locks" title="أقفال البوابة">🔒🔒🔒</span>
        </div>
      </div>

      <div id="room">
        <div class="room-code">الغرفة <b id="roomCode" dir="ltr"></b></div>
        <button id="inviteBtn" class="btn small">🔗 دعوة أصدقاء</button>
      </div>

      <canvas id="minimap" width="200" height="200"></canvas>
      <div id="players"></div>
      <div id="feed"></div>

      <div id="vitals">
        <div class="vital"><span>❤️</span><div class="bar"><i id="hpBar"></i></div></div>
        <div class="vital"><span>⚡</span><div class="bar"><i id="stBar"></i></div></div>
      </div>

      <div id="prompt" hidden></div>
      <div id="nano" hidden><span class="bot">🤖</span><span><b>نانو:</b> <span id="nanoText"></span></span></div>

      <div id="toolbar">
        <button id="journalBtn" title="سجل الحقائق (J)">📖</button>
        <button id="hintBtn" title="تلميح (H)">💡</button>
        <button id="chatBtn" title="دردشة (Enter)">💬</button>
        <button id="muteBtn" title="الصوت (M)">🔊</button>
        <button id="helpBtn" title="المساعدة">❔</button>
        <button id="fsBtn" title="ملء الشاشة">⛶</button>
      </div>

      <div id="chat">
        <div id="chatLog"></div>
        <input id="chatIn" maxlength="80" placeholder="اكتب رسالة ثم Enter" autocomplete="off" hidden />
      </div>
      <div id="netStatus" hidden></div>
      <div id="lockHint" hidden>انقر على الشاشة للتحكم بالكاميرا بالفأرة</div>
    </section>

    <!-- Touch controls -->
    <div id="touch" hidden>
      <div id="stick"><div id="knob"></div></div>
      <button id="btnAct" aria-label="تفاعل">✋</button>
      <button id="btnJump" aria-label="قفز">⤒</button>
    </div>

    <div id="modal" hidden><div id="card" class="card"></div></div>
    <div id="toast" hidden></div>
    <div id="loading"><div class="spinner"></div><div>جارٍ تجهيز الخلية…</div></div>
    <noscript><div class="noscript">هذه اللعبة تحتاج تفعيل JavaScript.</div></noscript>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
